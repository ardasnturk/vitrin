name: Release

# Pushing a tag v<version> (matching package.json, plugin.json and marketplace.json) builds and tests the
# repository, packs @ardasnturk/vitrin, creates the GitHub Release with that version's CHANGELOG section and the
# tarball the Claude Code plugin's launcher downloads, and publishes to npm when the NPM_TOKEN secret is set.
# It can also be started by hand (Actions → Release → Run workflow) on main: the release then creates the
# v<version> tag on the commit it built.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, test, pack and release
    runs-on: ubuntu-latest
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Enable pnpm (version from package.json)
        run: corepack enable
      - name: Check the tag matches the release version
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ "${GITHUB_REF_NAME}" != "main" ]; then
              echo "::error::Run the release by hand from main, not ${GITHUB_REF_NAME}"
              exit 1
            fi
          elif [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Typecheck (incl. Remotion sources)
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Pack
        id: pack
        run: pnpm pack:release
      - name: Check the tarball against the checksum the plugin records
        # plugins/vitrin/SHA256SUMS holds the SHA-256 of the gunzipped tar per version (`pnpm release:checksum`);
        # the plugin's launcher refuses a download that differs, so a release that differs must not be published.
        run: |
          name="${{ steps.pack.outputs.sum_name }}"
          actual="${{ steps.pack.outputs.sha256 }}"
          expected=$(grep -E "^[0-9a-fA-F]{64}  ${name//./\\.}$" plugins/vitrin/SHA256SUMS | cut -d' ' -f1 | head -n 1 | tr 'A-F' 'a-f')
          if [ -z "$expected" ]; then
            echo "::error::plugins/vitrin/SHA256SUMS has no entry for ${name}: run \`pnpm release:checksum\` and commit it before tagging"
            exit 1
          fi
          if [ "$expected" != "$actual" ]; then
            echo "::error::checksum mismatch for ${name}: the plugin records ${expected}, this build is ${actual}. The build is not reproducible from the tagged commit; rerun \`pnpm release:checksum\` on it and investigate before releasing."
            exit 1
          fi
          printf '%s  %s\n' "$actual" "$name" > "$RUNNER_TEMP/SHA256SUMS"
          echo "checksum ok: $actual  $name"
      - name: Release notes from CHANGELOG.md
        run: node scripts/release-notes.mjs "$VERSION" > "$RUNNER_TEMP/release-notes.md"
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A tag push releases that tag; a manual run creates v<version> on the commit it built.
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then tag_args=(--target "$GITHUB_SHA"); else tag_args=(--verify-tag); fi
          gh release create "v${VERSION}" "${{ steps.pack.outputs.tarball }}" "$RUNNER_TEMP/SHA256SUMS" \
            --title "Vitrin ${VERSION}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "${tag_args[@]}"
      - name: Publish to npm (only when NPM_TOKEN is set)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not set; skipping npm publish."
            exit 0
          fi
          npm publish "${{ steps.pack.outputs.tarball }}" --access public
