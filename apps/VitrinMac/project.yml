name: VitrinMac
options:
  bundleIdPrefix: com.jastech
  developmentLanguage: en
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "16.0"

settings:
  base:
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  VitrinMac:
    type: application
    platform: macOS
    sources:
      - path: VitrinMac
    settings:
      base:
        PRODUCT_NAME: Vitrin
        PRODUCT_BUNDLE_IDENTIFIER: com.jastech.vitrin
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Vitrin
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Arda Sentürk"
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        # The GitHub release feed; Sparkle itself is not bundled yet (see README → Updates).
        INFOPLIST_KEY_SUFeedURL: https://github.com/ardasnturk/vitrin/releases.atom
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: VitrinMac/Resources/VitrinMac.entitlements
        # Ad-hoc signing so the project builds on any Mac; set a team to run it signed.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        ENABLE_PREVIEWS: YES
        COMBINE_HIDPI_IMAGES: YES
        OTHER_LDFLAGS: "$(inherited)"
    info:
      path: VitrinMac/Resources/Info.plist
      properties:
        CFBundleName: Vitrin
        CFBundleDisplayName: Vitrin
        LSMinimumSystemVersion: "15.0"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "© 2026 Arda Sentürk"
        SUFeedURL: https://github.com/ardasnturk/vitrin/releases.atom
        # The Studio runs on 127.0.0.1 over plain HTTP.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSUserNotificationsUsageDescription: Vitrin tells you when a stage finished, when Claude asks a question and when a new version is available.

schemes:
  VitrinMac:
    build:
      targets:
        VitrinMac: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
