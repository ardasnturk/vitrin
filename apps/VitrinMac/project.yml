name: VitrinMac
options:
  bundleIdPrefix: com.jastech
  developmentLanguage: en
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "16.0"

settings:
  base:
    MARKETING_VERSION: 2.1.0
    CURRENT_PROJECT_VERSION: 4
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  VitrinMac:
    type: application
    platform: macOS
    sources:
      - path: VitrinMac
      # The Claude Code plugin's launcher and its checksums: the app installs the CLI with them.
      - path: ../../plugins/vitrin
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Vitrin
        PRODUCT_BUNDLE_IDENTIFIER: com.jastech.vitrin
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Vitrin
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Arda Sentürk"
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: VitrinMac/Resources/VitrinMac.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        ENABLE_PREVIEWS: YES
        COMBINE_HIDPI_IMAGES: YES
        OTHER_LDFLAGS: "$(inherited)"
      configs:
        # Debug signs ad hoc so the project builds on any Mac. Release is what scripts/build-mac.sh notarizes.
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "-"
        Release:
          DEVELOPMENT_TEAM: 5JMD3VSD7N
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          OTHER_CODE_SIGN_FLAGS: --timestamp
    info:
      path: VitrinMac/Resources/Info.plist
      properties:
        CFBundleName: Vitrin
        CFBundleDisplayName: Vitrin
        LSMinimumSystemVersion: "15.0"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "© 2026 Arda Sentürk"
        # The Studio runs on 127.0.0.1 over plain HTTP.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSUserNotificationsUsageDescription: Vitrin tells you when a stage finished, when Claude asks a question and when a new version is available.

  VitrinMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: VitrinMacTests
    dependencies:
      - target: VitrinMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jastech.vitrin.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        # XcodeGen derives TEST_HOST from the target name; the product is Vitrin.app.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Vitrin.app/Contents/MacOS/Vitrin
        BUNDLE_LOADER: $(TEST_HOST)

  VitrinMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: VitrinMacUITests
    dependencies:
      - target: VitrinMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jastech.vitrin.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        TEST_TARGET_NAME: VitrinMac

schemes:
  VitrinMac:
    build:
      targets:
        VitrinMac: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VitrinMacTests
        - VitrinMacUITests
      # The unit tests run inside the app; keep the host away from the user's projects, settings and GitHub.
      environmentVariables:
        VITRIN_UITEST: "1"
        VITRIN_DEFAULTS_SUITE: com.jastech.vitrin.tests
        VITRIN_APP_SUPPORT: $(PROJECT_DIR)/build-test/test-support
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
